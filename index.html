<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copa do Mundo FIFA 2026 — Jogos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: #006633;
      --verde-mid: #009148;
      --verde-light: #e6f5ec;
      --amarelo: #FFD700;
      --amarelo-mid: #e6be00;
      --azul: #003087;
      --branco: #ffffff;
      --cinza-bg: #f4f5f0;
      --cinza-card: #ffffff;
      --cinza-borda: rgba(0,0,0,0.10);
      --cinza-texto: #555f4e;
      --texto-principal: #111;
      --radius: 10px;
      --radius-lg: 14px;
    }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--cinza-bg);
      color: var(--texto-principal);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--verde);
      color: var(--branco);
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    .header-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 20px 12px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-trophy {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
    }
    .header-text h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
    }
    .header-text p {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.70);
      margin-top: 2px;
      letter-spacing: 0.06em;
    }
    .header-badge {
      margin-left: auto;
      background: var(--amarelo);
      color: var(--verde);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── MAIN ── */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    /* ── NAV DIAS ── */
    .day-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      background: var(--cinza-card);
      border: 1px solid var(--cinza-borda);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
    }
    .nav-btn {
      background: var(--verde-light);
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--verde);
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }
    .nav-btn:hover:not(:disabled) { background: #c8e9d4; }
    .nav-btn:active:not(:disabled) { transform: scale(0.94); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }
    .day-info { flex: 1; min-width: 0; }
    .day-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--texto-principal);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .today-pill {
      background: #e22;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      font-family: 'Barlow Condensed', sans-serif;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .day-sub {
      font-size: 12px;
      color: var(--cinza-texto);
      margin-top: 2px;
    }
    .day-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cinza-borda);
      transition: background 0.2s, transform 0.2s;
    }
    .dot.active {
      background: var(--verde);
      transform: scale(1.4);
    }
    .dot.played { background: #cde8d6; }

    /* ── JOGOS ── */
    .games-list { display: flex; flex-direction: column; gap: 10px; }

    .game-card {
      background: var(--cinza-card);
      border: 1px solid var(--cinza-borda);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: box-shadow 0.15s;
    }
    .game-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    .game-card.played .game-body { border-left: 4px solid var(--verde-mid); }
    .game-card.upcoming .game-body { border-left: 4px solid #e0e0d8; }

    .game-header {
      background: #f8f9f5;
      border-bottom: 1px solid var(--cinza-borda);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .game-group {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--verde);
    }
    .game-status {
      font-size: 11px;
      font-weight: 600;
    }
    .game-status.done { color: var(--verde-mid); }
    .game-status.pending { color: #999; }

    .game-body {
      padding: 14px 16px;
    }

    .matchup {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .team {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      min-width: 0;
    }
    .team.away {
      flex-direction: row-reverse;
    }
    .flag { width: 32px; height: 22px; object-fit: cover; border-radius: 3px; flex-shrink: 0; display: block; }
    .team-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--texto-principal);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team.away .team-name { text-align: right; }

    .score-center {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 72px;
      justify-content: center;
      flex-shrink: 0;
    }
    .score-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--texto-principal);
      min-width: 26px;
      text-align: center;
      line-height: 1;
    }
    .score-sep {
      font-size: 18px;
      color: #bbb;
      font-weight: 400;
    }
    .score-vs {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #bbb;
      letter-spacing: 0.06em;
    }

    .game-footer {
      padding: 6px 16px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--cinza-texto);
    }
    .game-footer svg { flex-shrink: 0; }

    /* ── VAZIO ── */
    .empty-day {
      text-align: center;
      padding: 48px 20px;
      color: var(--cinza-texto);
      font-size: 14px;
    }
    .empty-day span { font-size: 32px; display: block; margin-bottom: 8px; }

    /* ── FASE LABEL ── */
    .phase-divider {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cinza-texto);
      margin: 20px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--cinza-borda);
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .team-name { font-size: 13px; }
      .score-num { font-size: 24px; }
      .flag { font-size: 22px; }
      .header-text h1 { font-size: 17px; }
      .day-dots { display: none; }
    }
  </style>
</head>

  // ── RESULTADOS reais (preencha aqui conforme os jogos acontecerem) ──
  // Formato: 'Data_HomeAway': [golsHome, golsAway]
  // Exemplo: '2026-06-11_MéxicoArgentina': [1, 2]
  const RESULTADOS_REAIS = {
    // Adicione aqui quando os jogos acontecerem:
    // '2026-06-11_MéxicoArgentina': [1, 2],
  };

  // ── RESULTADO SIMULADO (fallback enquanto não há dados reais) ──
  function simularPlacar(game) {
    const seed = (game.home + game.away + game.date).split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    return { home: seed % 4, away: (seed * 7 + 13) % 4 };
  }

  function getPlacar(game) {
    const key = game.date + '_' + game.home + game.away;
    if (RESULTADOS_REAIS[key]) {
      return { home: RESULTADOS_REAIS[key][0], away: RESULTADOS_REAIS[key][1], real: true };
    }
    const s = simularPlacar(game);
    return { home: s.home, away: s.away, real: false };
  }

  // ── HELPERS ──
  const DIAS_PT    = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const MESES_PT   = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  function parseLocal(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function isGameOver(game) {
    // Considera encerrado se a data for antes de hoje
    // ou se hoje e horário passou (+ 2h de jogo)
    const d = parseLocal(game.date);
    d.setHours(parseInt(game.time.split(':')[0]) + 2, 0, 0, 0);
    return d <= NOW;
  }

  // ── ÍNDICE DOS DIAS ──
  const ALL_DATES = [...new Set(GAMES.map(g => g.date))].sort();

  function findInitialDay() {
    const idx = ALL_DATES.findIndex(d => d >= TODAY_STR);
    return idx === -1 ? ALL_DATES.length - 1 : Math.max(0, idx);
  }

  let currentIdx = findInitialDay();

  // ── RENDER ──
  function renderDots() {
    const container = document.getElementById('dayDots');
    const max = Math.min(ALL_DATES.length, 15);
    const half = Math.floor(max / 2);
    const start = Math.max(0, Math.min(currentIdx - half, ALL_DATES.length - max));
    container.innerHTML = '';
    for (let i = start; i < start + max && i < ALL_DATES.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === currentIdx ? ' active' : i < currentIdx ? ' played' : '');
      container.appendChild(dot);
    }
  }

  function render() {
    const dateStr = ALL_DATES[currentIdx];
    const d = parseLocal(dateStr);
    const isToday = dateStr === TODAY_STR;

    // Cabeçalho do dia
    const nameEl = document.getElementById('dayName');
    nameEl.innerHTML = DIAS_PT[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES_PT[d.getMonth()]
      + (isToday ? ' <span class="today-pill">Hoje</span>' : '');
    document.getElementById('daySub').textContent =
      'Dia ' + (currentIdx + 1) + ' de ' + ALL_DATES.length + '  •  Copa do Mundo 2026';

    document.getElementById('prevBtn').disabled = currentIdx === 0;
    document.getElementById('nextBtn').disabled = currentIdx === ALL_DATES.length - 1;

    renderDots();

    const dayGames = GAMES.filter(g => g.date === dateStr);
    const list = document.getElementById('gamesList');
    list.innerHTML = '';

    if (dayGames.length === 0) {
      list.innerHTML = '<div class="empty-day"><span>⚽</span>Nenhum jogo programado para este dia.</div>';
      return;
    }

    // Agrupar por grupo/fase
    const groups = {};
    dayGames.forEach(g => {
      if (!groups[g.group]) groups[g.group] = [];
      groups[g.group].push(g);
    });

    Object.entries(groups).forEach(([grp, games]) => {
      const div = document.createElement('div');
      div.className = 'phase-divider';
      div.textContent = grp;
      list.appendChild(div);

      games.forEach(game => {
        const played = isGameOver(game);
        const placar = played ? getPlacar(game) : null;
        const card = document.createElement('div');
        card.className = 'game-card ' + (played ? 'played' : 'upcoming');

        card.innerHTML = `
          <div class="game-header">
            <span class="game-group">${game.group}</span>
            <span class="game-status ${played ? 'done' : 'pending'}">${played ? '✔ Encerrado' : '⏰ ' + game.time + ' (local)'}</span>
          </div>
          <div class="game-body">
            <div class="matchup">
              <div class="team">
                <img class="flag" src="${game.hf}" alt="${game.home}" />
                <span class="team-name">${game.home}</span>
              </div>
              <div class="score-center">
                ${played
                  ? `<span class="score-num">${placar.home}</span><span class="score-sep">–</span><span class="score-num">${placar.away}</span>`
                  : `<span class="score-vs">vs</span>`
                }
              </div>
              <div class="team away">
                <img class="flag" src="${game.af}" alt="${game.away}" />
                <span class="team-name">${game.away}</span>
              </div>
            </div>
          </div>
          <div class="game-footer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${game.venue}
          </div>
        `;
        list.appendChild(card);
      });
    });
  }

  // ── EVENTOS ──
  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentIdx > 0) { currentIdx--; render(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentIdx < ALL_DATES.length - 1) { currentIdx++; render(); }
  });

  // Swipe no mobile
  let touchStartX = 0;
  document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
  document.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) > 50) {
      if (diff > 0 && currentIdx < ALL_DATES.length - 1) { currentIdx++; render(); }
      if (diff < 0 && currentIdx > 0) { currentIdx--; render(); }
    }
  });

  // ── INIT ──
  render();
</script>
</body>
</html>
